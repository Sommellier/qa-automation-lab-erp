services:
  postgres:
    image: postgres:17-alpine
    container_name: qa-management-postgres
    environment:
      POSTGRES_DB: qa_management
      POSTGRES_USER: qa_management
      POSTGRES_PASSWORD: qa_management_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_management -d qa_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qa_management_postgres_data:/var/lib/postgresql/data

volumes:
  qa_management_postgres_data:

